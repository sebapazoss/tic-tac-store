<!DOCTYPE html>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .product-card-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .product-card-shadow:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px -1px rgba(0, 0, 0, 0.06);

    <style>
        body {

<body class="bg-background text-on-surface font-body-lg overflow-x-hidden">
    <!-- TopAppBar Shell -->
    <header
        class="fixed top-0 w-full z-50 bg-surface border-b border-surface-variant flex justify-between items-center px-container-margin h-16 w-full max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
            <button class="hover:opacity-70 transition-opacity active:scale-95 transition-transform duration-200">
                <span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
            </button>
        </div>
        <div class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-primary">HOROLOGY</div>

            <button class="hover:opacity-70 transition-opacity active:scale-95 transition-transform duration-200">
                <span class="material-symbols-outlined text-primary" data-icon="shopping_bag">shopping_bag</span>
            </button>
        </div>

    <main class="pt-24 pb-32 px-container-margin max-w-7xl mx-auto">

                </button>
            </div>
            <!-- Chips / Categories -->
            <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1">

                    class="px-5 py-1.5 rounded-full bg-primary-container text-white font-label-caps text-label-caps whitespace-nowrap">ALL
                    TIMEPIECES</button>

    <script>
        // Simple Micro-interactions
        document.querySelectorAll('.cursor-pointer').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const img = card.querySelector('img');
                if (img) img.style.transform = 'scale(1.05)';
            });
            card.addEventListener('mouseleave', () => {
                const img = card.querySelector('img');
                if (img) img.style.transform = 'scale(1)';
            });
        });

        // Search Bar Focus Effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('ring-1', 'ring-primary');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('ring-1', 'ring-primary');
        });
    </script>
</body>
